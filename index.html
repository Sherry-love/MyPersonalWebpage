    <script>
        // GitHub Pages 的 404.html 会把 /a1 这类路径改写成 /?/a1，
        // 这里在应用启动前把它还原成真实路径，供 BrowserRouter 读取。
        (function (location) {
            if (location.search[1] === '/') {
                var decoded = location.search
                    .slice(1)
                    .split('&')
                    .map(function (segment) { return segment.replace(/~and~/g, '&'); })
                    .join('?');
                window.history.replaceState(
                    null,
                    '',
                    location.pathname.slice(0, -1) + decoded + location.hash
                );
            }
        })(window.location);
    </script>
