    <title>Dreamy Developer Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .text-glow {
            text-shadow: 0 0 8px currentColor, 0 0 12px rgba(196, 181, 253, 0.5);
        }
        .animate-gradient-text {
            background: linear-gradient(90deg, #f9a8d4, #c4b5fd, #a5b4fc, #f9a8d4);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text; /* For Safari compatibility */
            color: transparent;
            animation: gradient-animation 4s linear infinite;
        }

        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        @keyframes pulse-fade {
            0%, 100% {
                opacity: 0.7;
                /* transform property removed to prevent overriding inline positioning */
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes text-fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

          }
